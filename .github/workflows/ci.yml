name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  verification:
    name: Verification Gate (${{ matrix.task }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        task: [ "lint", "test", "build" ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node (optional tooling)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute Verification (${{ matrix.task }})
        shell: pwsh
        run: |
          Write-Host "Running Verification Stage: ${{ matrix.task }}..."
          if ("${{ matrix.task }}" -eq "lint") {
            if (Test-Path "package.json") {
              npm run lint --if-present
            } else {
              Write-Host "No package.json present; running script syntax audit."
              .\scripts\verify-gate.ps1 -Mode Fast
            }
          } elseif ("${{ matrix.task }}" -eq "test") {
            # Execute tiered verification gate
            .\scripts\verify-gate.ps1 -Mode Fast

            # Run model optimizer metrics collection and policy audit
            Write-Host "`n>> Updating Model Optimization Telemetry..."
            .\scripts\collect-model-stats.ps1
            .\scripts\apply-model-optimisation.ps1
          } elseif ("${{ matrix.task }}" -eq "build") {
            if (Test-Path "package.json") {
              npm run build --if-present
            } else {
              Write-Host "Template project build verification passed."
            }
          }
          Write-Host "Stage ${{ matrix.task }} completed cleanly."
