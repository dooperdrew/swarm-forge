<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090E17"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="460" fill="url(#bgGradient)"/>
  <rect width="1200" height="460" fill="url(#grid)"/>

  <!-- Radial Glow Behind Title -->
  <circle cx="600" cy="90" r="180" fill="#6366F1" opacity="0.18" filter="url(#glow)"/>
  <circle cx="250" cy="220" r="140" fill="#0EA5E9" opacity="0.12" filter="url(#glow)"/>
  <circle cx="950" cy="220" r="140" fill="#A855F7" opacity="0.12" filter="url(#glow)"/>

  <!-- Header Badge -->
  <g transform="translate(600, 48)">
    <rect x="-160" y="-14" width="320" height="28" rx="14" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <circle cx="-138" cy="0" r="4" fill="#10B981"/>
    <text x="-124" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#94A3B8" letter-spacing="1.5">AUTONOMOUS MULTI-AGENT FORGE</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="112" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="48" font-weight="800" fill="url(#accentGradient)" letter-spacing="-0.5">
    ⚡ SwarmForge
  </text>

  <!-- Subtitle -->
  <text x="600" y="148" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#94A3B8">
    The Spec-First Engineering Forge for Autonomous AI Coding Swarms &amp; Verification Gates
  </text>

  <!-- Architecture Flow Columns (Cards) -->
  <g transform="translate(60, 185)">
    <!-- Column 1: Spec Stack -->
    <g transform="translate(0, 0)">
      <rect width="245" height="180" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
      <rect x="0" y="0" width="245" height="4" rx="2" fill="#38BDF8"/>
      <circle cx="26" cy="30" r="12" fill="#0369A1" opacity="0.4"/>
      <text x="26" y="35" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#38BDF8">📋</text>
      <text x="48" y="35" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">Living Spec Stack</text>
      <text x="18" y="65" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#38BDF8">• docs/01-vision.md</text>
      <text x="18" y="85" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#94A3B8">• docs/02-requirements.md</text>
      <text x="18" y="105" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#94A3B8">• docs/03-architecture.md</text>
      <text x="18" y="125" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#94A3B8">• docs/05-roadmap.md</text>
      <text x="18" y="152" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="400" fill="#64748B">Zero context drift across sessions</text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <path d="M 252 90 L 273 90" stroke="#475569" stroke-width="2" stroke-dasharray="4 3"/>
    <polygon points="273,86 281,90 273,94" fill="#64748B"/>

    <!-- Column 2: Multi-Agent Hub -->
    <g transform="translate(285, 0)">
      <rect width="245" height="180" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
      <rect x="0" y="0" width="245" height="4" rx="2" fill="#818CF8"/>
      <circle cx="26" cy="30" r="12" fill="#4338CA" opacity="0.4"/>
      <text x="26" y="35" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#818CF8">🤖</text>
      <text x="48" y="35" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">Multi-Agent Hub</text>
      <text x="18" y="65" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#818CF8">• Lead Agent (Sole Committer)</text>
      <text x="18" y="85" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#94A3B8">• Copilot Cloud Worker (Draft PR)</text>
      <text x="18" y="105" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#94A3B8">• Worker Swarms (flash_lite)</text>
      <text x="18" y="125" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#94A3B8">• Isolated Git Worktrees</text>
      <text x="18" y="152" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="400" fill="#64748B">Disjoint file ownership &amp; clean git</text>
    </g>

    <!-- Arrow 2 -> 3 -->
    <path d="M 537 90 L 558 90" stroke="#475569" stroke-width="2" stroke-dasharray="4 3"/>
    <polygon points="558,86 566,90 558,94" fill="#64748B"/>

    <!-- Column 3: Tiered Verification -->
    <g transform="translate(570, 0)">
      <rect width="245" height="180" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
      <rect x="0" y="0" width="245" height="4" rx="2" fill="#A855F7"/>
      <circle cx="26" cy="30" r="12" fill="#6B21A8" opacity="0.4"/>
      <text x="26" y="35" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#A855F7">🛡️</text>
      <text x="48" y="35" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">Tiered Quality Gate</text>
      <text x="18" y="65" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#C084FC">• verify-gate.ps1 (-Mode Fast)</text>
      <text x="18" y="85" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#94A3B8">• Sub-second syntax &amp; tests</text>
      <text x="18" y="105" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#94A3B8">• Full Mode for Lead committer</text>
      <text x="18" y="125" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#94A3B8">• Autonomous UI QA (ui-qa-tester)</text>
      <text x="18" y="152" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="400" fill="#64748B">Claims strictly follow evidence</text>
    </g>

    <!-- Arrow 3 -> 4 -->
    <path d="M 822 90 L 843 90" stroke="#475569" stroke-width="2" stroke-dasharray="4 3"/>
    <polygon points="843,86 851,90 843,94" fill="#64748B"/>

    <!-- Column 4: Self-Tuning & Release -->
    <g transform="translate(855, 0)">
      <rect width="225" height="180" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.2"/>
      <rect x="0" y="0" width="225" height="4" rx="2" fill="#10B981"/>
      <circle cx="26" cy="30" r="12" fill="#065F46" opacity="0.4"/>
      <text x="26" y="35" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" fill="#10B981">🚀</text>
      <text x="48" y="35" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">Tuning &amp; Release</text>
      <text x="18" y="65" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#34D399">• Model Optimizer (Token Tuning)</text>
      <text x="18" y="85" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#94A3B8">• Living docs/lessons-learned</text>
      <text x="18" y="105" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#94A3B8">• Portable single-binary ZIP</text>
      <text x="18" y="125" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#94A3B8">• WinGet &amp; Scoop manifests</text>
      <text x="18" y="152" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="400" fill="#64748B">Continuous learning &amp; distribution</text>
    </g>
  </g>

  <!-- Bottom Badges / Tech Row -->
  <g transform="translate(600, 415)" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748B">
    <text>Supported Agents: Antigravity • GitHub Copilot • Claude Code • Cursor • Windsurf • Polyglot: Rust • TypeScript • Python • Go</text>
  </g>
</svg>
